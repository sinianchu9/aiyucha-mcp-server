[project]
name = "aiyucha-domain-intelligence-mcp"
version = "0.1.0"
description = "Public read-only domain research MCP service from AIYuCha"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0,<3.0",
  "httpx>=0.28,<1",
  "idna>=3.7,<5",
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]
[project.scripts]
aiyucha-mcp = "aiyucha_mcp.server:main"
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/aiyucha_mcp"]
[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
