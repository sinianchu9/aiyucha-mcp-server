name: MCP server tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'
      - name: Run independent MCP tests
        run: python -m pytest -q tests/test_intelligence.py tests/test_backend.py tests/test_protocol.py
      - name: Verify review manifests
        run: python -c "import json; from pathlib import Path; p=json.loads(Path('submission/plugin.json').read_text()); assert p['version']=='1.0.4'; assert len(p['extensions']['com.openai']['review']['test_cases']['positive'])==5"
