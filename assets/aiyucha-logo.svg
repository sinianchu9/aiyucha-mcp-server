<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">爱域查 AIYuCha</title>
  <desc id="desc">爱域查开放扫描环与域名地球品牌图标</desc>
  <defs>
    <linearGradient id="scanRing" x1="20" y1="14" x2="111" y2="111" gradientUnits="userSpaceOnUse">
      <stop stop-color="#245BFF"/>
      <stop offset="0.52" stop-color="#00B8F0"/>
      <stop offset="1" stop-color="#00D6A3"/>
    </linearGradient>
    <linearGradient id="globeStroke" x1="37" y1="34" x2="93" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A73FF"/>
      <stop offset="1" stop-color="#1347D8"/>
    </linearGradient>
    <linearGradient id="wordBand" x1="38" y1="55" x2="90" y2="75" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A63F5"/>
      <stop offset="0.58" stop-color="#087FE8"/>
      <stop offset="1" stop-color="#00AFCF"/>
    </linearGradient>
  </defs>

  <!-- 开放扫描环：用缺口表达“查找 / 探测”，不使用放大镜造型。 -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="url(#scanRing)" stroke-width="10" stroke-linecap="round" stroke-dasharray="246 68" transform="rotate(39 64 64)"/>
  <circle cx="64" cy="64" r="50" fill="none" stroke="#7BE8FF" stroke-opacity=".62" stroke-width="2" stroke-linecap="round" stroke-dasharray="38 276" transform="rotate(18 64 64)"/>
  <circle cx="108" cy="36" r="4.5" fill="#00D6A3"/>

  <!-- 地球 -->
  <circle cx="64" cy="64" r="31" fill="#F8FCFF" stroke="url(#globeStroke)" stroke-width="4.5"/>
  <path d="M34 64h60M40 50c7 3 15 5 24 5s17-2 24-5M40 78c7-3 15-5 24-5s17 2 24 5" fill="none" stroke="#65B6F6" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M64 34c-8 8-13 18-13 30s5 22 13 30M64 34c8 8 13 18 13 30s-5 22-13 30" fill="none" stroke="#2B83EA" stroke-width="2.8" stroke-linecap="round"/>

  <!-- 以 aiyucha 取代传统 WWW -->
  <rect x="35" y="55" width="58" height="19" rx="9.5" fill="url(#wordBand)"/>
  <text x="64" y="68.4" text-anchor="middle" font-size="12.6" font-weight="800" letter-spacing=".15" fill="#FFFFFF" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">aiyucha</text>

  <!-- 两个轻量扫描节点，强化科技感而不形成手柄。 -->
  <circle cx="22" cy="88" r="2.5" fill="#2A6CFF"/>
  <circle cx="104" cy="92" r="2.2" fill="#00B8F0"/>
</svg>
